# CityForward Health - local stack.
#   docker compose up --build          the customer's world: Postgres, MediTrack (+ FHIR/SMART/webhooks), mock payer, gateway
#   docker compose --profile idp up    + Keycloak (the hospital's identity provider)
# MediTrack: http://localhost:8001        mock payer: http://localhost:8003/rules      AI service (via the gateway): http://localhost:8001/ai/healthz
#   export GROQ_API_KEY=...   to switch the AI from its offline template mode to openai/gpt-oss-20b on Groq
name: cityforward

x-customer: &customer
  build: ./customer
  image: cityforward-customer
  restart: unless-stopped

services:
  db:   # the hospital's database server (Oracle in the story; Azure Database for PostgreSQL in the cloud)
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./customer/platform/compose/initdb:/docker-entrypoint-initdb.d:ro
    ports: ["${PG_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 40

  keygen:   # the AI vendor's key pair for SMART Backend Services; only the PUBLIC half (JWKS) goes to the hospital
    build: {context: ., dockerfile: ai/Dockerfile}
    image: cityforward-ai
    restart: "no"
    user: "0"
    entrypoint: ["python", "scripts/gen_keys.py", "/keys"]
    environment: {KEYGEN_SHARED: "1"}
    volumes: [aikeys:/keys]

  seed:   # first-start data load (Synthea + golden patients). Re-run with: docker compose run --rm seed --force
    <<: *customer
    restart: "no"
    environment:
      APP_ROLE: seed
      MEDITRACK_DB_URL: postgresql://meditrack:meditrack@db:5432/meditrack
      MEDITRACK_DOCS_DIR: /data/documents
      MEDITRACK_HOTFOLDER: /data/import_hotfolder
      AI_WEBHOOK_SECRET: ${AI_WEBHOOK_SECRET:-dev-webhook-secret}
      AI_BACKEND_JWKS_FILE: /keys/ai-backend.jwks.json
      AI_WEBHOOK_URL: http://ai:8080/webhooks/meditrack
      AI_LAUNCH_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}/ai/launch
    volumes: [docs:/data/documents, hotfolder:/data/import_hotfolder, "aikeys:/keys:ro"]
    depends_on:
      db: {condition: service_healthy}
      keygen: {condition: service_completed_successfully}

  meditrack:
    <<: *customer
    environment:
      APP_ROLE: meditrack
      MEDITRACK_DB_URL: postgresql://meditrack:meditrack@db:5432/meditrack
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8001}
      SMART_SIGNING_KEY_PEM: ${SMART_SIGNING_KEY_PEM:-}
    volumes: [docs:/data/documents, hotfolder:/data/import_hotfolder]
    depends_on:
      seed: {condition: service_completed_successfully}

  ai:   # the vendor's service (what the course builds): RAG, prior-auth drafting, coding, audit, webhooks
    build: {context: ., dockerfile: ai/Dockerfile}
    image: cityforward-ai
    restart: unless-stopped
    environment:
      COPILOT_DB_URL: postgresql://copilot:copilot@db:5432/copilot
      MEDITRACK_BASE_URL: http://meditrack:8001
      PAYER_BASE_URL: http://payer:8003
      PAYER_API_KEY: ${PAYER_API_KEY:-demo-payer-key}
      AI_BACKEND_KEY_FILE: /keys/ai-backend.pem
      AI_WEBHOOK_SECRET: ${AI_WEBHOOK_SECRET:-dev-webhook-secret}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080/realms/cityforward}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-cityforward-ai}
      EMBEDDER: ${EMBEDDER:-hash}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    volumes: ["aikeys:/keys:ro"]
    depends_on:
      db: {condition: service_healthy}
      keygen: {condition: service_completed_successfully}
      meditrack: {condition: service_started}

  payer:    # the insurer's prior-authorization API (fictional)
    <<: *customer
    environment:
      APP_ROLE: payer
      PAYER_API_KEY: ${PAYER_API_KEY:-demo-payer-key}
    ports: ["${PAYER_PORT:-8003}:8003"]

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes: ["./customer/platform/compose/gateway/Caddyfile:/etc/caddy/Caddyfile:ro"]
    ports: ["${MEDITRACK_PORT:-8001}:80"]
    depends_on: [meditrack, ai]

  keycloak:   # optional hospital IdP (docker compose --profile idp up)
    profiles: ["idp"]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./customer/platform/keycloak:/opt/keycloak/data/import:ro"]
    ports: ["${KEYCLOAK_PORT:-8180}:8080"]

volumes:
  aikeys:
  pgdata:
  docs:
  hotfolder:
