{{- range $n := list "meditrack" "payer" "copilot" "postgres" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $n }}
  labels: {{- include "cf.labels" $ | nindent 4 }}
  {{- if and $.Values.keyVault.enabled (eq $n "copilot") }}
  annotations:
    azure.workload.identity/client-id: {{ $.Values.keyVault.workloadIdentityClientId | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.keyVault.tenantId | quote }}
  {{- end }}
automountServiceAccountToken: false      # none of these workloads talks to the Kubernetes API (the workload-identity webhook injects its own projected token)
{{- end }}
