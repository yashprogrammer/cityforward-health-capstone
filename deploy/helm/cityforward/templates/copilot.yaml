apiVersion: v1
kind: Service
metadata:
  name: copilot
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  selector: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: copilot-metrics               # separate from the ingress-facing service: metrics are never routed through the ingress
  labels: {{- include "cf.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  clusterIP: None
  selector: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 4 }}
  ports: [{name: metrics, port: {{ .Values.copilot.metricsPort }}, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: copilot
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  {{- if not .Values.copilot.hpa.enabled }}
  replicas: {{ .Values.copilot.replicas }}
  {{- end }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: copilot
      automountServiceAccountToken: false
      securityContext: {{- include "cf.podSecurity" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 14 }}
      containers:
        - name: copilot
          image: {{ include "cf.image" .Values.images.ai }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          env:
            - {name: COPILOT_DB_URL, valueFrom: {secretKeyRef: {name: {{ .Values.externalDatabase.secretName }}, key: copilot-url}}}
            - {name: MEDITRACK_BASE_URL, value: "http://meditrack:8001"}
            - {name: PAYER_BASE_URL, value: "http://payer:8003"}
            - {name: PAYER_API_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.payer.apiKeySecret }}, key: api-key}}}
            - {name: AI_BACKEND_KEY_FILE, value: /keys/ai-backend.pem}
            - {name: AI_WEBHOOK_SECRET, valueFrom: {secretKeyRef: {name: {{ .Values.copilot.webhookSecret }}, key: secret}}}
            - {name: EMBEDDER, value: {{ .Values.copilot.embedder | quote }}}
            - {name: LLM_PROVIDER, value: {{ .Values.copilot.llm.provider | quote }}}
            - {name: LLM_MODEL, value: {{ .Values.copilot.llm.model | quote }}}
            {{- if .Values.copilot.llm.baseUrl }}
            - {name: LLM_BASE_URL, value: {{ .Values.copilot.llm.baseUrl | quote }}}
            {{- end }}
            {{- if ne .Values.copilot.llm.provider "offline" }}
            - {name: {{ ternary "GROQ_API_KEY" "LLM_API_KEY" (eq .Values.copilot.llm.provider "groq") }}, valueFrom: {secretKeyRef: {name: {{ .Values.copilot.llm.secretName }}, key: api-key, optional: true}}}
            {{- end }}
            {{- if .Values.copilot.keycloak.issuer }}
            - {name: KEYCLOAK_ISSUER, value: {{ .Values.copilot.keycloak.issuer | quote }}}
            - {name: KEYCLOAK_INTERNAL_URL, value: {{ .Values.copilot.keycloak.internalUrl | quote }}}
            - {name: KEYCLOAK_AUDIENCE, value: {{ .Values.copilot.keycloak.audience | quote }}}
            {{- end }}
            {{- if .Values.copilot.otel.endpoint }}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.copilot.otel.endpoint | quote }}}
            {{- end }}
            - {name: METRICS_PORT, value: {{ .Values.copilot.metricsPort | quote }}}
            - {name: EVENT_WORKER, value: {{ .Values.copilot.eventWorker | quote }}}
            - {name: DEPLOY_ENV, value: {{ .Values.global.environment | quote }}}
            - {name: FASTEMBED_CACHE_PATH, value: /opt/fastembed}
          ports:
            - {name: http, containerPort: 8080}
            - {name: metrics, containerPort: {{ .Values.copilot.metricsPort }}}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 3, failureThreshold: 40}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 20, failureThreshold: 4}
          resources: {{- toYaml .Values.copilot.resources | nindent 12 }}
          securityContext: {{- include "cf.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: keys
          secret: {secretName: {{ .Values.copilot.keysSecret }}, defaultMode: 0440, items: [{key: ai-backend.pem, path: ai-backend.pem}]}
        - {name: tmp, emptyDir: {}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: copilot
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {{- include "cf.selector" (dict "name" "copilot" "root" .) | nindent 6 }}
{{- if .Values.copilot.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: copilot
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: copilot}
  minReplicas: {{ .Values.copilot.hpa.min }}
  maxReplicas: {{ .Values.copilot.hpa.max }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.copilot.hpa.cpu }}}}
{{- end }}
{{- if .Values.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: copilot
  labels: {{- include "cf.labels" . | nindent 4 }}
spec:
  selector: {matchLabels: {app.kubernetes.io/component: metrics}}
  endpoints: [{port: metrics, interval: 30s}]
{{- end }}
