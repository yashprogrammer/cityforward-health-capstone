{{- if .Values.postgres.enabled }}
{{- /* dev/kind only: generated once, kept across upgrades. Production uses a Key Vault-synced secret of the same shape. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.externalDatabase.secretName }}
{{- $mt := "" }}{{- $co := "" }}{{- $su := "" }}
{{- if $existing }}
  {{- $mt = index $existing.data "meditrack-password" | b64dec }}
  {{- $co = index $existing.data "copilot-password" | b64dec }}
  {{- $su = index $existing.data "postgres-password" | b64dec }}
{{- else }}
  {{- $mt = randAlphaNum 24 }}{{- $co = randAlphaNum 24 }}{{- $su = randAlphaNum 24 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.externalDatabase.secretName }}
  labels: {{- include "cf.labels" . | nindent 4 }}
  annotations: {"helm.sh/resource-policy": keep}
type: Opaque
stringData:
  postgres-password: {{ $su | quote }}
  meditrack-password: {{ $mt | quote }}
  copilot-password: {{ $co | quote }}
  meditrack-url: {{ printf "postgresql://meditrack:%s@postgres:5432/meditrack" $mt | quote }}
  copilot-url: {{ printf "postgresql://copilot:%s@postgres:5432/copilot" $co | quote }}
{{- end }}
