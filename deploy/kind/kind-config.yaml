kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cityforward
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - {containerPort: 80, hostPort: 8081, protocol: TCP}      # http://localhost:8081  = the hospital's front door
      - {containerPort: 443, hostPort: 8443, protocol: TCP}
  - role: worker
  - role: worker
networking:
  disableDefaultCNI: false      # kindnet: does not enforce NetworkPolicy. For a policy-enforcing laptop cluster use Calico (see deploy/README.md)
