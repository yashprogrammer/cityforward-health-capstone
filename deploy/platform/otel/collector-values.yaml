# Helm values for the open-telemetry/opentelemetry-collector chart (Argo app: argocd/apps/otel-collector.yaml).
# Pipeline: services -> OTLP -> [scrub PHI] -> Jaeger (traces) + Prometheus (RED metrics derived from traces).
# The Copilot already avoids PHI in spans (copilot/telemetry.py); this is the second line of defence, tested in deploy/tests/test_otel_collector.py.
mode: deployment
replicaCount: 2
image:
  repository: otel/opentelemetry-collector-contrib
  tag: "0.116.1"
command: {name: otelcol-contrib}
ports:
  otlp: {enabled: true}
  otlp-http: {enabled: true}
  prom: {enabled: true, containerPort: 8889, servicePort: 8889, protocol: TCP}
podSecurityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
resources: {requests: {cpu: 100m, memory: 200Mi}, limits: {cpu: 500m, memory: 400Mi}}
config:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: "0.0.0.0:4317"}
        http: {endpoint: "0.0.0.0:4318"}
  processors:
    memory_limiter: {check_interval: 1s, limit_mib: 300, spike_limit_mib: 60}
    # 1. drop attributes that can identify a person or carry credentials, whatever produced them
    attributes/drop-sensitive:
      actions:
        - {key: http.request.header.authorization, action: delete}
        - {key: http.request.header.cookie, action: delete}
        - {key: http.request.header.x-meditrack-signature, action: delete}
        - {key: http.response.header.set-cookie, action: delete}
        - {key: enduser.id, action: delete}
        - {key: user.email, action: delete}
        - {key: user.full_name, action: delete}
        - {key: db.statement, action: delete}
        - {key: db.query.text, action: delete}
        - {key: url.query, action: delete}
        - {key: http.target.query, action: delete}
    # 2. patient / request ids in paths become templates
    transform/paths:
      error_mode: ignore
      trace_statements:
        - context: span
          statements:
            - replace_pattern(name, "/(patients|prior-auth|coding|events|break-glass)/[^/\\s?]+", "/$$1/{id}")
            - replace_pattern(attributes["url.path"], "/(patients|prior-auth|coding|events|break-glass)/[^/\\s?]+", "/$$1/{id}")
            - replace_pattern(attributes["http.target"], "/(patients|prior-auth|coding|events|break-glass)/[^/\\s?]+", "/$$1/{id}")
            - replace_pattern(attributes["url.full"], "/(patients|prior-auth|coding|events|break-glass)/[^/\\s?]+", "/$$1/{id}")
            - replace_pattern(attributes["http.url"], "/(patients|prior-auth|coding|events|break-glass)/[^/\\s?]+", "/$$1/{id}")
    # 3. anything in any attribute value that looks like an identifier is masked
    redaction:
      allow_all_keys: true
      blocked_values:
        - '\b\d{3}-\d{2}-\d{4}\b'                              # SSN
        - '\b[\w.+-]+@[\w-]+(\.[\w-]+)+\b'                     # e-mail
        - '(?:\+?1[-. ]?)?\(?\d{3}\)?[-. ]\d{3}[-. ]\d{4}'     # US phone
        - '\bCF\d{6}\b'                                        # MediTrack MRN
        - '\b[A-Z]{2}\d{4}-\d{4}\b'                            # hospital account / encounter number
        - '\b(19|20)\d{2}-\d{2}-\d{2}\b'                       # full dates
        - 'Bearer\s+[A-Za-z0-9._~+/-]+=*'                      # tokens
      summary: info
    batch: {timeout: 2s, send_batch_size: 512}
  connectors:
    spanmetrics:
      histogram: {explicit: {buckets: [100ms, 250ms, 500ms, 1s, 2s, 5s, 10s]}}
      dimensions: [{name: http.method}, {name: http.status_code}, {name: llm.purpose}]
  exporters:
    otlphttp/jaeger: {endpoint: "http://jaeger-collector.observability:4318", tls: {insecure: true}}    # in-mesh traffic is mTLS via Linkerd
    prometheus: {endpoint: "0.0.0.0:8889", namespace: copilot_otel}
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, attributes/drop-sensitive, transform/paths, redaction, batch]
        exporters: [spanmetrics, otlphttp/jaeger]
      metrics:
        receivers: [spanmetrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
