# Same-origin front door for the Azure demo: MediTrack on / and the Copilot on /ai. Replaces ingress-nginx (retired).
# demo.sh substitutes __IMAGE__, __HOST__ (the gateway's public IP) and __SOURCE_RANGE__ (your public IP /32): the Service is public only to you.
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels: {pod-security.kubernetes.io/enforce: restricted}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: gateway, namespace: gateway}
data:
  Caddyfile: |
    {
      admin off
      auto_https disable_redirects
      skip_install_trust
      default_sni __HOST__
    }
    # In-cluster health only (the Service does not expose this port).
    :8080 {
      handle /gateway-healthz {
        respond "ok" 200
      }
    }
    # Browsers only give pages crypto.subtle (needed for the SMART PKCE sign-in) over HTTPS or localhost. A public IP cannot get a public
    # certificate, so Caddy signs one with its own CA: the browser warns once; click through for the demo.
    https://__HOST__:8443 {
      tls internal
      handle_path /ai/* {
        reverse_proxy copilot.cityforward.svc.cluster.local:8080
      }
      handle {
        reverse_proxy meditrack.cityforward.svc.cluster.local:8001
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: __IMAGE__
          ports: [{name: health, containerPort: 8080}, {name: https, containerPort: 8443}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /gateway-healthz, port: health}}
          livenessProbe: {httpGet: {path: /gateway-healthz, port: health}}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: state, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, configMap: {name: gateway}}
        - {name: state, emptyDir: {}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: gateway}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerSourceRanges: ["__SOURCE_RANGE__"]
  selector: {app: gateway}
  ports: [{name: https, port: 443, targetPort: https}]
