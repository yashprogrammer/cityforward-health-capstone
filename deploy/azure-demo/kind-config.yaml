kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cityforward
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30080, hostPort: 8081, listenAddress: "127.0.0.1", protocol: TCP}
networking:
  disableDefaultCNI: false
# Local functional validation only: kindnet does not enforce NetworkPolicy.
