apiVersion: v1
kind: ConfigMap
metadata: {name: local-gateway, namespace: cityforward}
data:
  Caddyfile: |
    {
      admin off
      auto_https off
    }
    :8080 {
      handle /gateway-healthz {
        respond "ok" 200
      }
      handle_path /ai/* {
        reverse_proxy copilot:8080
      }
      handle {
        reverse_proxy meditrack:8001
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: local-gateway, namespace: cityforward}
spec:
  replicas: 1
  selector: {matchLabels: {app: local-gateway}}
  template:
    metadata: {labels: {app: local-gateway}}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: cityforward-gateway:dev
          ports: [{name: http, containerPort: 8080}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 25m, memory: 32Mi}, limits: {cpu: 250m, memory: 128Mi}}
          readinessProbe: {httpGet: {path: /gateway-healthz, port: http}}
          livenessProbe: {httpGet: {path: /gateway-healthz, port: http}}
          volumeMounts:
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: state, mountPath: /config}
            - {name: data, mountPath: /data}
      volumes:
        - {name: config, configMap: {name: local-gateway}}
        - {name: state, emptyDir: {}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: local-gateway, namespace: cityforward}
spec:
  type: NodePort
  selector: {app: local-gateway}
  ports: [{name: http, port: 8080, targetPort: http, nodePort: 30080}]
