# Versions are ranges on purpose: pin exact chart versions after the first successful sync.
# The authoring sandbox could not reach the chart repositories, so these charts are UNVERIFIED against the live registries.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: cityforward
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: 3.*
    helm:
      valuesObject:
        provisionDataStore:
          cassandra: false
        storage:
          type: memory
        allInOne:
          enabled: true
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
