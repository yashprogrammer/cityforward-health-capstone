# Versions are ranges on purpose: pin exact chart versions after the first successful sync.
# The authoring sandbox could not reach the chart repositories, so these charts are UNVERIFIED against the live registries.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: falco
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: cityforward
  destination:
    server: https://kubernetes.default.svc
    namespace: falco
  sources:
  - repoURL: https://falcosecurity.github.io/charts
    chart: falco
    targetRevision: 4.*
    helm:
      valueFiles:
      - $values/deploy/platform/falco/values.yaml
  - repoURL: https://github.com/yashprogrammer/cityforward-health-capstone
    targetRevision: integrated
    ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
